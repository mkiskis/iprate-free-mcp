# Production configuration for the public MCP Worker.
name = "iprate-mcp"
main = "src/index.ts"
compatibility_date = "2026-08-01"
workers_dev = false
routes = [
  { pattern = "mcp.iprate.eu", custom_domain = true }
]

[observability]
enabled = true

[vars]
ASSET_BASE_URL = "https://iprate.eu/data/v1"
# Domain-verification token from the OpenAI plugin portal, served as plain text
# at /.well-known/openai-apps-challenge. Keep it here once issued: wrangler
# deploy replaces variables set only in the dashboard.
# OPENAI_APPS_CHALLENGE = "<token from the portal>"

[[r2_buckets]]
binding = "RELEASES"
bucket_name = "iprate-mcp"

# Anonymous per-client rate control (spec §7). Returns HTTP 429 + Retry-After;
# results are never silently truncated.
[[unsafe.bindings]]
name = "RATE_LIMITER"
type = "ratelimit"
namespace_id = "1001"
simple = { limit = 120, period = 60 }
