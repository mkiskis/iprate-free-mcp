services:
  mcp:
    build: .
    image: iprate-free-mcp:0.2.0
    container_name: iprate-free-mcp
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    mem_limit: 1536m
    cpus: 2.0
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      # Serve from the refresher's immutable per-release snapshot, never the
      # live mutating export tree.
      IPRATE_MCP_ASSET_ROOT: /data/current
    volumes:
      - ${IPRATE_MCP_RELEASES_ROOT:-/home/ming/iprate-free-mcp-releases}:/data:ro
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=8)"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 180s
    networks:
      - runtime

  refresher:
    build: .
    image: iprate-free-mcp:0.2.0
    container_name: iprate-free-mcp-refresher
    restart: unless-stopped
    read_only: true
    # Needs no network at all: static files in, static files out.
    network_mode: "none"
    user: "${IPRATE_MCP_REFRESH_UID:-1000}:${IPRATE_MCP_REFRESH_GID:-1000}"
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    mem_limit: 1536m
    cpus: 2.0
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    command:
      - iprate-free-mcp-refresh-release
      - --live-root
      - /live/data/v1
      - --releases-root
      - /data
      - --interval
      - "300"
    volumes:
      - ${IPRATE_STATIC_ROOT:-/home/ming/iprate-output/data/v1}:/live/data/v1:ro
      - ${IPRATE_MCP_RELEASES_ROOT:-/home/ming/iprate-free-mcp-releases}:/data:rw

networks:
  runtime:
    external: true
    name: runtime_default
