services:
  mcp:
    build: .
    image: iprate-free-mcp:0.1.0
    container_name: iprate-free-mcp
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    mem_limit: 768m
    cpus: 1.0
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    volumes:
      - ${IPRATE_STATIC_ROOT:-/home/ming/iprate-output/data/v1}:/data/v1:ro
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import socket; connection = socket.create_connection(('127.0.0.1', 8000), 2); connection.close()"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 45s
    networks:
      - runtime

networks:
  runtime:
    external: true
    name: runtime_default
