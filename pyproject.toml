[project]
name = "iprate-free-mcp"
version = "0.1.0"
description = "Open adapter for IPRATE's free public European IP analytics MCP server"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
  "mcp>=2.1,<3",
  "pydantic>=2.10,<3",
  "uvicorn>=0.32",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28",
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "ruff>=0.8",
]

[project.scripts]
iprate-free-mcp = "iprate.mcp.cli:main"
iprate-free-mcp-build-catalog = "iprate.mcp.catalog_cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/iprate"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 120
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "S", "B", "A", "C4", "SIM", "TCH"]
ignore = ["S101"]

[tool.ruff.lint.isort]
known-first-party = ["iprate"]
